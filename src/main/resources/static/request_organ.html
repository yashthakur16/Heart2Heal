<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request an Organ</title>
    <link rel="stylesheet" href="request_organ.css">
</head>
<style>
    /* assets/styles.css */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #fff0f5;
    background-image: url('https://transparenttextures.com/patterns/light-pink-floral.png');
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #8b005d;
}

.container {
    background-color: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(214, 104, 157, 0.3);
    width: 90%;
    max-width: 500px;
    border: 2px solid #ffb6c1;
    position: relative;
    overflow: hidden;
}

.container::before {
    content: "";
    position: absolute;
    top: -10px;
    left: -10px;
    right: -10px;
    bottom: -10px;
    background: linear-gradient(45deg, #ffb6c1, #ff69b4, #db7093);
    z-index: -1;
    border-radius: 20px;
    opacity: 0.3;
}

h2 {
    text-align: center;
    color: #d63384;
    margin-bottom: 25px;
    font-size: 28px;
    text-shadow: 1px 1px 2px rgba(214, 51, 132, 0.2);
    position: relative;
}

h2::after {
    content: "";
    display: block;
    width: 70px;
    height: 3px;
    background: linear-gradient(to right, #ff69b4, #db7093);
    margin: 10px auto;
}

form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

label {
    font-weight: 600;
    color: #c71585;
    margin-bottom: -10px;
}

select, button {
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px solid #ffb6c1;
    font-size: 16px;
    transition: all 0.3s ease;
}

select {
    background-color: #fff9fa;
    color: #8b005d;
    cursor: pointer;
}

select:focus {
    outline: none;
    border-color: #ff69b4;
    box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.2);
}

button {
    background: linear-gradient(to right, #ff69b4, #db7093);
    color: white;
    font-weight: bold;
    border: none;
    cursor: pointer;
    margin-top: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

button:hover {
    background: linear-gradient(to right, #db7093, #ff69b4);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(219, 112, 147, 0.4);
}

button:active {
    transform: translateY(0);
}

button[onclick] {
    background: linear-gradient(to right, #ffb6c1, #ff69b4);
    margin-top: 20px;
}

.heart-icon {
    position: absolute;
    opacity: 0.1;
    z-index: -1;
}

.heart-icon:nth-child(1) {
    top: 10%;
    left: 5%;
    font-size: 30px;
    animation: float 6s ease-in-out infinite;
}

.heart-icon:nth-child(2) {
    bottom: 15%;
    right: 8%;
    font-size: 40px;
    animation: float 8s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-15px);
    }
}

/* Additional decorative elements */
.organ-icon {
    text-align: center;
    margin-bottom: 20px;
}

.organ-icon img {
    width: 80px;
    height: 80px;
    filter: drop-shadow(0 0 5px rgba(219, 112, 147, 0.5));
}
</style>
<body>
    <div class="container">
        <h2>Request an Organ</h2>
        <form id="organRequestForm">
            <label for="organType">Organ Type:</label>
            <select id="organType" required>
                <option value="Kidney">Kidney</option>
                <option value="Liver">Liver</option>
                <option value="Heart">Heart</option>
                <option value="Lung">Lungs</option>
                
            </select>

            <label for="bloodType">Blood Type:</label>
            <select id="bloodType" required>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <button type="submit">Submit Request</button>
        </form>
        <button onclick="location.href='dashboard.html'">Back to Dashboard</button>
    </div>

    <div class="heart-icon">❤️</div>
<div class="heart-icon">❤️</div>
<div class="organ-icon">
    <img src="https://cdn-icons-png.flaticon.com/512/3059/3059518.png" alt="Organ icon" id="dynamicOrganIcon">
</div>

    <script src="js/request_organ.js"></script>
</body>
</html>
