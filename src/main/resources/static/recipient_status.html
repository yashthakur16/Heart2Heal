<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipient Status</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>

<style>
    /* assets/styles.css */
body {
    font-family: 'Poppins', sans-serif;
    background-color: #fff0f6;
    background-image: url('https://transparenttextures.com/patterns/pink-dust.png');
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #8b005d;
}

.container {
    background-color: rgba(255, 245, 250, 0.95);
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(219, 112, 147, 0.2);
    width: 90%;
    max-width: 700px;
    border: 2px solid #ffcce6;
    position: relative;
    overflow: hidden;
}

.container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, #ffb6c1, #ff69b4, #db7093);
}

h2 {
    text-align: center;
    color: #d63384;
    margin-bottom: 25px;
    font-size: 28px;
    position: relative;
    padding-bottom: 10px;
}

h2::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 3px;
    background: linear-gradient(to right, #ffb6c1, #ff69b4);
}

h3 {
    color: #c71585;
    border-left: 4px solid #ff69b4;
    padding-left: 10px;
    margin-top: 30px;
}

#recipientStatus, #matchingUpdates {
    background-color: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #ffd6e7;
    box-shadow: 0 4px 12px rgba(255, 182, 193, 0.15);
    margin-bottom: 20px;
    min-height: 80px;
    position: relative;
}

#recipientStatus::before, #matchingUpdates::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 5px;
    height: 100%;
    background: linear-gradient(to bottom, #ff69b4, #ffb6c1);
    border-radius: 12px 0 0 12px;
}

a {
    display: inline-block;
    padding: 12px 25px;
    background: linear-gradient(135deg, #ff69b4, #ff8fab);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 600;
    margin: 15px 0;
    box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
    transition: all 0.3s ease;
    text-align: center;
}

a:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
    background: linear-gradient(135deg, #ff8fab, #ff69b4);
}

button {
    display: block;
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #ffb6c1, #ff8fab);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 25px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(219, 112, 147, 0.25);
}

button:hover {
    background: linear-gradient(135deg, #ff8fab, #ffb6c1);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(219, 112, 147, 0.35);
}

.status-icon {
    text-align: center;
    margin: 20px 0;
}

.status-icon img {
    width: 120px;
    height: 120px;
    filter: drop-shadow(0 5px 10px rgba(219, 112, 147, 0.3));
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.loading-dots::after {
    content: "...";
    animation: dots 1.5s steps(5, end) infinite;
}

@keyframes dots {
    0%, 20% { content: "."; }
    40% { content: ".."; }
    60%, 100% { content: "..."; }
}

.heart-decoration {
    position: absolute;
    font-size: 24px;
    color: rgba(255, 182, 193, 0.6);
    z-index: -1;
    animation: float 6s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
}

</style>

<body>
    <div class="container">
        <h2>Organ Request Status</h2>

        <div id="recipientStatus">Loading...</div>

        <h3>Matching Updates</h3>
        <div id="matchingUpdates">Loading...</div>

        

        <button onclick="logout()">Logout</button>
    </div>

    <div class="heart-decoration" style="top: 10%; left: 5%;">❤️</div>
<div class="heart-decoration" style="bottom: 15%; right: 8%;">❤️</div>
<div class="heart-decoration" style="top: 20%; right: 10%;">❤️</div>
<div class="status-icon">
    <img src="recipent.png" alt="Status icon">
</div>

    <script src="js/recipient_status.js"></script>
</body>
</html>
