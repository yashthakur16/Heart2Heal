<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate an Organ</title>
  <link rel="stylesheet" href="assets/donate.css">
</head>

<style>
  /* Global Styles */
  :root {
    --primary: #e91e63;
    --secondary: #9c27b0;
    --accent: #ff5722;
    --light: #f8f5f7;
    --dark: #333;
    --success: #4caf50;
    --info: #2196f3;
  }
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background: linear-gradient(135deg, var(--light), #fce4ec);
    font-family: 'Poppins', sans-serif;
    color: var(--dark);
    line-height: 1.6;
    padding: 20px;
    min-height: 100vh;
  }
  
  h1, h2, h3 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
  }
  
  /* Two-Column Layout */
  .columns-container {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
    align-items: flex-start;
  }
  
  .left-column,
  .right-column {
    flex: 1;
    min-width: 300px;
  }
  
  /* Form Container (Left Column) */
  .form-container {
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(233, 30, 99, 0.1);
    position: relative;
    overflow: hidden;
  }
  
  .form-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 5px;
    height: 100%;
    background: linear-gradient(to bottom, var(--primary), var(--secondary));
  }
  
  .form-container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: var(--primary);
    font-size: 28px;
    position: relative;
    padding-bottom: 10px;
  }
  
  .form-container h2::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: linear-gradient(to right, var(--primary), var(--secondary));
    border-radius: 3px;
  }
  
  .form-container label {
    display: block;
    margin-bottom: 8px;
    color: var(--dark);
    font-weight: 500;
    font-size: 14px;
  }
  
  .form-container input[type="text"],
  .form-container input[type="email"],
  .form-container input[type="tel"],
  .form-container input[type="date"],
  .form-container select,
  .form-container textarea {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    color: var(--dark);
    transition: all 0.3s ease;
    background-color: #f9f9f9;
  }
  
  .form-container input:focus,
  .form-container select:focus,
  .form-container textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.1);
    outline: none;
    background-color: #fff;
  }
  
  .form-container input[type="checkbox"] {
    margin-right: 8px;
    accent-color: var(--primary);
  }
  
  .form-container button[type="submit"] {
    width: 100%;
    background: linear-gradient(to right, var(--primary), var(--secondary));
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
    margin-top: 10px;
  }
  
  .form-container button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
  }
  
  /* Chat Button */
  .chat-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 20px;
    background: linear-gradient(to right, var(--success), #2e7d32);
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
  }
  
  .chat-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
  }
  
  /* Right Column: Info Container */
  .right-column {
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(156, 39, 176, 0.1);
    position: relative;
    overflow: hidden;
  }
  
  .right-column::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 5px;
    height: 100%;
    background: linear-gradient(to bottom, var(--secondary), var(--primary));
  }
  
  .info-container h2 {
    color: var(--secondary);
    margin-bottom: 20px;
    font-size: 26px;
    position: relative;
    padding-bottom: 10px;
  }
  
  .info-container h2::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 60px;
    height: 3px;
    background: linear-gradient(to right, var(--secondary), var(--primary));
    border-radius: 3px;
  }
  
  .info-container p {
    font-size: 16px;
    color: #555;
    margin-bottom: 20px;
    padding-left: 10px;
    border-left: 3px solid var(--primary);
  }
  
  .info-container img {
    max-width: 100%;
    border-radius: 10px;
    display: block;
    margin: 25px auto 0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
  }
  
  .info-container img:hover {
    transform: scale(1.02);
  }
  
  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .columns-container {
      flex-direction: column;
    }
    
    .left-column,
    .right-column {
      width: 100%;
    }
    
    .form-container,
    .right-column {
      padding: 20px;
    }
  }
  
  /* Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .form-container,
  .right-column {
    animation: fadeIn 0.6s ease-out forwards;
  }
  
  .right-column {
    animation-delay: 0.2s;
  }
</style>

<body>
  <div class="columns-container">
    <!-- Left Column: Donation Form -->
    <div class="left-column">
      <div class="form-container">
        <h2>Donate an Organ</h2>
        <form id="donateForm">
          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" name="fullName" required>

          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" required>

          <label for="gender">Gender:</label>
          <select id="gender" name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>

          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="phone" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <label for="address">Address:</label>
          <textarea id="address" name="address" rows="2" required></textarea>

          <label for="organType">Select Organ:</label>
          <select id="organType" name="organType" required>
            <option value="Kidney">Kidney</option>
            <option value="Liver">Liver</option>
            <option value="Heart">Heart</option>
            <option value="Lungs">Lungs</option>
          </select>

          <label for="bloodType">Select Blood Type:</label>
          <select id="bloodType" name="bloodType" required>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>

          <label for="medicalHistory">Medical History:</label>
          <textarea id="medicalHistory" name="medicalHistory" rows="3" required></textarea>

          <label for="lifestyleHabits">Lifestyle Habits:</label>
          <textarea id="lifestyleHabits" name="lifestyleHabits" rows="3" required></textarea>

          <label for="emergencyContact">Emergency Contact:</label>
          <input type="text" id="emergencyContact" name="emergencyContact" required>

          <label>
            <input type="checkbox" id="legalConsent" name="legalConsent" required>
            I agree to the legal terms and consent to organ donation.
          </label>

          <button type="submit">Submit Donation</button>
        </form>
        <!-- Chat Button -->
        <button class="chat-btn" onclick="openChat()">Chat with Recipient</button>
      </div>
    </div>
    
    <!-- Right Column: Information -->
    <div class="right-column">
      <div class="info-container">
        <h2>Why Donate?</h2>
        <p>Organ donation saves lives. By donating, you're giving someone a second chance at life.</p>
        <p>Your selfless act can have a lasting impact on individuals and communities.</p>
        <img src="organ.webp" alt="Donate Illustration">
      </div>
    </div>
  </div>

  <script src="js/donate.js"></script>
</body>
</html>
